services:
  - type: web
    name: nyc-airbnb-classifier-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: MODEL_PATH
        value: /opt/render/project/src/Model_Pipeline.pkl
      - key: CORS_ORIGINS
        sync: false